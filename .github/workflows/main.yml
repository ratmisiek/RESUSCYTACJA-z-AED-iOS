name: Build iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v5

      - name: Sprawdź Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Zbuduj aplikację iOS
        run: |
          xcodebuild \
            -project "RESUSCYTACJA_z_AED.xcodeproj" \
            -scheme "RESUSCYTACJA_z_AED" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sprawdź gotową aplikację
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/RESUSCYTACJA z AED.app"
          test -d "$APP_PATH"
          echo "Gotowa aplikacja:"
          ls -la "$APP_PATH"

      - name: Spakuj aplikację
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/RESUSCYTACJA z AED.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "RESUSCYTACJA_z_AED_iOS_Simulator.zip"
          ls -lh "RESUSCYTACJA_z_AED_iOS_Simulator.zip"

      - name: Udostępnij artefakt
        uses: actions/upload-artifact@v4
        with:
          name: RESUSCYTACJA-z-AED-iOS-Simulator
          path: RESUSCYTACJA_z_AED_iOS_Simulator.zip
          if-no-files-found: error
          retention-days: 7
